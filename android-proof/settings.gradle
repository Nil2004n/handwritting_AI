// Android PROOF HARNESS: a separate Gradle build (not part of the desktop build, so desktop builds never need an Android SDK).
// It includes the portable engine module from ../engine as-is and depends on it like any consumer would.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'notebook-ai-android-proof'
include ':app'
include ':engine'
project(':engine').projectDir = file('../engine')
// Included only so its classes can be API-checked against Android (the proof app itself does not use spelling).
include ':spelling'
project(':spelling').projectDir = file('../spelling')
